
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense | SpendWise</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 8%;
        }

        main {
            max-width: 600px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 14px;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button, .back {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 7px;
        }
    </style>
</head>

<body>
<header>
    <h1>SpendWise 💰</h1>
    <p>Add a new expense</p>
</header>

<main>
    <h2>Expense Details</h2>

    <p class="success"
       th:if="${successMessage}"
       th:text="${successMessage}"></p>

    <form action="/expenses" method="post" th:object="${expense}">

        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" th:field="*{amount}"
               min="0.01" step="0.01" required>

        <label for="category">Category</label>
        <select id="category" th:field="*{category}" required>
            <option value="">Choose a category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Education">Education</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
        </select>

        <label for="description">Description</label>
        <input id="description" type="text"
               th:field="*{description}"
               placeholder="Example: Lunch" required>

        <label for="date">Date</label>
        <input id="date" type="date" th:field="*{date}" required>

        <label for="paymentMethod">Payment Method</label>
        <select id="paymentMethod" th:field="*{paymentMethod}" required>
            <option value="">Choose payment method</option>
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Card">Card</option>
            <option value="Bank Transfer">Bank Transfer</option>
        </select>

        <button type="submit">Save Expense</button>
        <a class="back" href="/">Back to Dashboard</a>
    </form>
</main>
</body>
</html>
