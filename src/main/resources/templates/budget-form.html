
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Monthly Budget - SpendWise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #0000000a;
        }

        h1 { color: #172554; }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button, a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        button {
            background: #2563eb;
            color: white;
        }

        a {
            background: #e2e8f0;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Monthly Budget 💰</h1>
        <p>Choose how much money you want to spend this month.</p>

        <form th:action="@{/budget}" th:object="${budget}" method="post">
            <label for="monthlyBudget">Monthly budget (₹)</label>

            <input
                type="number"
                id="monthlyBudget"
                th:field="*{monthlyBudget}"
                min="1"
                step="0.01"
                required>

            <button type="submit">Save Budget</button>
            <a href="/">Back to Dashboard</a>
        </form>
    </div>
</body>
</html>
